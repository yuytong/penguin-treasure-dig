function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(mode==='dig'&&timedModal)timeLeft-=dt;else if(mode==='dig'&&(overlay.classList.contains('hidden')||summonsChoiceRemaining>0)&&t>=lockUntil)timeLeft-=dt;

 if((mode==='dig'||mode==='intro'||mode==='results'||mode==='failed')&&!digging){let dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);if(d>2){player.aimX=dx/d;player.aimY=dy/d;let v=Math.min(d,150*dt);player.x+=dx/d*v;player.y+=dy/d*v;player.step+=dt*8}}
 const fx=player.faceX+(player.aimX-player.faceX)*Math.min(1,dt*10),fy=player.faceY+(player.aimY-player.faceY)*Math.min(1,dt*10),flen=Math.hypot(fx,fy)||1;player.faceX=fx/flen;player.faceY=fy/flen;
 if(mode==='dig'&&autoDig&&!digging&&Math.hypot(player.tx-player.x,player.ty-player.y)<=2){autoDig=false;dig()}

function buildRandomRoute(){const route=[[0,0]],checkpoints=[[9,2],[12,2],[13,3],[15,7]];let [x,y]=route[0];for(const [targetX,targetY] of checkpoints){const moves=[];for(let i=x;i<targetX;i++)moves.push([1,0]);for(let i=y;i<targetY;i++)moves.push([0,1]);for(let i=moves.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[moves[i],moves[j]]=[moves[j],moves[i]]}for(const [dx,dy] of moves){x+=dx;y+=dy;route.push([x,y])}}return route}function startRoad(){playSfx('level');mode='road';roadControls.classList.remove('hidden');startRoadTicker();roadStartedAt=0;roadFinishAt=0;gridPos=0;trollUses=0;typhoonTriggered=false;trafficEvents=0;campaignPromptTriggered=false;typhoonCell=null;trail=[];roadTarget=null;digging=false;const route=buildRandomRoute();roadEventIndices={traffic1:Math.round((route.length-1)*.25),typhoon:Math.round((route.length-1)*.5),traffic2:Math.round((route.length-1)*.6),campaign:Math.round((route.length-1)*.8)};roadSet=new Set(route.map(p=>`${p[0]},${p[1]}`));trail=route;player.x=player.tx=roadX+roadCellW/2;player.y=player.ty=roadY+roadCellH/2;setStatus('拚連任中');cardHtml('第二關｜民怨四起，強勢領表拚連任','<p>從選委會出發，沿著被雜草遮住的馬路挖到市政府。</p><p>只能挖目前位置上下左右相鄰的格子。挖到雜草會觸發市政二選一；答對回到正確道路，答錯連任失敗。</p><p>按下出發後開始計時，抵達市政府時停止。</p>',[{label:'從選委會出發',action:()=>{roadStartedAt=performance.now();hideCard()}}])}

function drawRoad(){ctx.fillStyle='#7aa858';ctx.fillRect(0,0,W,H);for(let i=0;i<190;i++){let x=(i*137)%W,y=(i*83)%H;ctx.fillStyle=i%4?'#386943':'#d4ca6a';ctx.beginPath();ctx.ellipse(x,y,5,11,(i%8)/8,0,7);ctx.fill()}drawHUD();
 // Unexcavated tiles all share the same grass cover. Only revealed cells show road.
 for(let r=0;r<roadRows;r++)for(let c=0;c<roadCols;c++){let x=roadX+c*roadCellW,y=roadY+r*roadCellH,isStart=c===0&&r===0,isEnd=c===15&&r===7,passed=trail.slice(0,gridPos+1).some(p=>p[0]===c&&p[1]===r);if(!passed&&!isStart&&!isEnd){ctx.fillStyle='#71994e';ctx.fillRect(x+2,y+2,roadCellW-4,roadCellH-4);ctx.fillStyle='#93b65e';ctx.beginPath();ctx.ellipse(x+12,y+17,6,13,-.4,0,7);ctx.ellipse(x+38,y+39,6,12,.3,0,7);ctx.fill();ctx.strokeStyle='#aec777';ctx.lineWidth=1.5;ctx.strokeRect(x+4,y+4,roadCellW-8,roadCellH-8)}else if(passed){const flooded=typhoonTriggered&&typhoonCell&&c===typhoonCell.c&&r===typhoonCell.r;ctx.fillStyle=flooded?'#197da9':colors.roadEdge;ctx.fillRect(x+3,y+3,roadCellW-6,roadCellH-6);ctx.fillStyle=flooded?'#78e0e9':colors.road;ctx.fillRect(x+6,y+6,roadCellW-12,roadCellH-12);if(flooded){ctx.strokeStyle='#e0ffff';ctx.lineWidth=2;for(let wave=0;wave<3;wave++){ctx.beginPath();ctx.moveTo(x+9,y+15+wave*11);ctx.quadraticCurveTo(x+20,y+10+wave*11,x+28,y+15+wave*11);ctx.quadraticCurveTo(x+39,y+20+wave*11,x+45,y+15+wave*11);ctx.stroke()}}ctx.strokeStyle=flooded?'#e0ffff':'#555e61';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,roadCellW-6,roadCellH-6)}else{ctx.strokeStyle='#92704c';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,roadCellW-6,roadCellH-6)}if(isStart)drawText('選委會',x+roadCellW/2,y-10,13,'#fff','center');if(isEnd)drawText('市政府',x+roadCellW/2,y+roadCellH+13,13,'#fff','center');if(passed&&!isStart&&!isEnd){drawText('➤',x+roadCellW/2,y+roadCellH/2+7,18,'#ffe477','center')}
 if(!digging&&Math.abs(c-(trail[gridPos]?.[0]||0))+Math.abs(r-(trail[gridPos]?.[1]??0))===1){ctx.strokeStyle='#ffe579';ctx.lineWidth=2;ctx.strokeRect(x+7,y+7,roadCellW-14,roadCellH-14)}}
 // The heroine arrives in an excavator and operates its arm one stroke per click.
 drawExcavator(player.x,player.y,performance.now());drawText(digging?'挖土機正在挖掘…':'點選相鄰格子，讓挖土機一格一格前進',480,650,16,'#fff','center')}
function drawExcavator(x,y,t){ctx.save();ctx.translate(x,y);let dir=player.faceX<0?-1:1,bob=Math.sin(t/140)*.8;ctx.fillStyle='#26344d66';ctx.beginPath();ctx.ellipse(0,22,39,8,0,0,7);ctx.fill();
 // crawler tracks and rollers
 ctx.fillStyle='#39434b';ctx.beginPath();ctx.roundRect(-31,7,62,16,8);ctx.fill();ctx.fillStyle='#879093';for(let i=-22;i<=22;i+=11){ctx.beginPath();ctx.arc(i,15,4,0,7);ctx.fill()}
 // yellow chassis and operator cab
 ctx.fillStyle='#edaa32';ctx.beginPath();ctx.roundRect(-24,-5,40,17,5);ctx.fill();ctx.fillStyle='#e0a02c';ctx.beginPath();ctx.roundRect(-14,-25,27,25,5);ctx.fill();ctx.fillStyle='#91c7d4';ctx.beginPath();ctx.roundRect(-10,-21,18,13,3);ctx.fill();ctx.strokeStyle='#fff0bb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-1,-20);ctx.lineTo(-1,-9);ctx.stroke();
 // driver in the cab: side-parted purple ponytail, face and two visible nostrils
 ctx.fillStyle='#49324d';ctx.beginPath();ctx.ellipse(-4,-30+bob,9,10,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(5,-24+bob,4,9,.3,0,7);ctx.fill();ctx.fillStyle='#efc39b';ctx.beginPath();ctx.arc(-2,-29+bob,7,0,7);ctx.fill();ctx.fillStyle='#b68ad3';ctx.fillRect(1,-36+bob,6,3);ctx.fillStyle='#342d42';ctx.beginPath();ctx.arc(-5,-30+bob,1,0,7);ctx.arc(0,-30+bob,1,0,7);ctx.fill();ctx.fillStyle='#6e4244';ctx.beginPath();ctx.arc(-3,-26+bob,.8,0,7);ctx.arc(0,-26+bob,.8,0,7);ctx.fill();
 // articulated boom and bucket. The short cycle makes each dig feel deliberate.
 let swing=digging?Math.sin((digEndsAt-t)/260)*.16:0,rootX=dir*11,rootY=-12,elbowX=dir*(30+Math.cos(swing)*3),elbowY=-26+Math.sin(swing)*13,tipX=dir*(42+Math.cos(swing)*4),tipY=-8+Math.sin(swing)*16;ctx.lineCap='round';ctx.strokeStyle='#d98d22';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(rootX,rootY);ctx.lineTo(elbowX,elbowY);ctx.lineTo(tipX,tipY);ctx.stroke();ctx.strokeStyle='#f5c04a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(rootX,rootY);ctx.lineTo(elbowX,elbowY);ctx.lineTo(tipX,tipY);ctx.stroke();ctx.fillStyle='#9aa3a5';ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX+dir*9,tipY+2);ctx.lineTo(tipX+dir*6,tipY+10);ctx.lineTo(tipX-dir*2,tipY+7);ctx.closePath();ctx.fill();ctx.strokeStyle='#596164';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function cellFromEvent(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;return{x,y}}
function attemptRoadMove(c,r){if(mode!=='road'||!overlay.classList.contains('hidden')||digging)return;if(c<0||r<0||c>=roadCols||r>=roadRows)return;const current=trail[gridPos],adj=Math.abs(c-current[0])+Math.abs(r-current[1]);if(adj!==1){setStatus('只能挖相鄰的格子');return}player.aimX=c>current[0]?1:c<current[0]?-1:0;player.aimY=r>current[1]?1:r<current[1]?-1:0;roadTarget={c,r};digging=true;digEndsAt=performance.now()+1050;setStatus('人物停住，舉鏟挖路…')}
roadControls.addEventListener('click',e=>{const button=e.target.closest('button[data-dx]');if(!button)return;const current=trail[gridPos];attemptRoadMove(current[0]+Number(button.dataset.dx),current[1]+Number(button.dataset.dy))});
canvas.addEventListener('click',e=>{if(!overlay.classList.contains('hidden')||digging)return;const p=cellFromEvent(e);if(mode==='dig'){if(p.y<105)return;player.tx=Math.max(28,Math.min(930,p.x));player.ty=Math.max(150,Math.min(680,p.y));autoDig=true;setStatus('角色前往指定地點…');return}if(mode==='road'){const c=Math.floor((p.x-roadX)/roadCellW),r=Math.floor((p.y-roadY)/roadCellH);attemptRoadMove(c,r);return}});
const mockupTiles=[0,1,2,3,4,5,6,7,10,11,12,13];function mockupBlock(tile,label){const x=((tile%4)/3*100).toFixed(2),y=(Math.floor(tile/4)/3*100).toFixed(2);return `<div class="mockup-render" role="img" aria-label="${label}" style="--tile-x:${x}%;--tile-y:${y}%"></div><p class="mockup-caption">AI 示意圖</p>`}function showWrongRoadWarning(){cardHtml('挖錯馬路！','<p>草叢太多，導致挖錯馬路</p><p>即將面對市政考驗</p>');setTimeout(()=>{if(mode==='road'&&!overlay.classList.contains('hidden'))askQuestion()},2200)}
function askQuestion(){let q=qs[Math.floor(Math.random()*qs.length)];question=q;const tile=mockupTiles[qs.indexOf(q)];const choices=[{label:`A. ${q[1]}`,action:()=>answer(false)},{label:`B. ${q[2]}`,action:()=>answer(true)}];if(trollUses<3)choices.push({label:`召集網軍洗風向（剩餘 ${3-trollUses} 次）`,action:runTrollCampaign});cardHtml('市政考驗｜二選一',`${mockupBlock(tile,`AI示意圖：${q[0]}`)}<p><b>${q[0]}</b></p>`,choices,'答對會回到正確道路；答錯連任失敗。也可消耗一次網軍洗風向機會，直接推進道路。')}

function triggerTrafficLight(eventNumber){playSfx('traffic');const previous=eventNumber===1;const cue=previous?'強制回顧四年前政見發表｜大數據專家':'本次政見發表會';const videoAsset=previous?'smart-signal-01.mp4':'smart-signal-02.mp4';const recap=`<p class="traffic-recap">${previous?cue:'本次政見發表：交通已獲得舒緩'}</p>`;const captionParts=previous?['透過大數據的計算，','智慧號誌系統就可以來做一個搭配，','如何在路口和路口之間透過智慧號誌秒數的最佳化，','讓車流順暢，不再塞車']:['所以 我們想跟大家分享的是 ','在交通問題的舒緩上 ','我們確實做了一些努力 ','也確實獲得了一些改善'];const scene=`<div class="traffic-scene"><div class="traffic-stage"><div class="traffic-video-wrap"><video class="traffic-press-video" autoplay muted playsinline loop preload="auto" aria-label="主角記者會動畫影片"><source src="assets/${videoAsset}" type="video/mp4"></video><div class="traffic-subtitle" id="traffic-caption" aria-live="polite">${captionParts[0]}</div></div><div class="traffic-signal"><i></i><span id="traffic-countdown">87</span><i></i><i></i></div></div></div>${recap}`;cardHtml(previous?'碰到智慧號誌系統':'連續碰到智慧號誌系統',scene,[],'倒數期間第二關計時繼續。');const speechVideo=card.querySelector('.traffic-press-video');if(speechVideo)speechVideo.play().catch(()=>{});const caption=card.querySelector('#traffic-caption');const captionTotal=captionParts.reduce((sum,part)=>sum+part.length,0);let captionIndex=0;const showCaption=()=>{if(!caption)return;caption.textContent=captionParts[captionIndex];if(captionIndex<captionParts.length-1){const delay=13000*captionParts[captionIndex].length/captionTotal;captionIndex++;setTimeout(showCaption,delay)}};showCaption();setStatus(`${cue}｜紅燈等待中……`);const duration=13000,endsAt=performance.now()+duration;const updateCountdown=()=>{const left=Math.max(0,(endsAt-performance.now())/duration),seconds=Math.ceil(87*left),light=card.querySelector('#traffic-countdown');if(light)light.textContent=String(seconds)};updateCountdown();const countdownTimer=setInterval(()=>{if(mode!=='road'||overlay.classList.contains('hidden')){clearInterval(countdownTimer);return}updateCountdown()},100);setTimeout(()=>{clearInterval(countdownTime
